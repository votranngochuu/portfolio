<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Huu Vo</title>
<meta name="robots" content="noindex">
<!-- Inline favicon so it works at any missing nested path. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23070917'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial' font-size='27' font-weight='800' fill='%2360a5fa'%3EHV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root { --bg: #05060f; --text: #cbd5e1; --muted: #94a3b8; --head: #f1f5f9; --c1: #22d3ee; --c2: #60a5fa; --c3: #8b5cf6; --border: rgba(148, 163, 184, .22); --solid-bg: #f1f5f9; --solid-fg: #05060f; color-scheme: dark; }
:root[data-theme="light"] { --bg: #f8fafc; --text: #334155; --muted: #64748b; --head: #0f172a; --c1: #0891b2; --c2: #2563eb; --c3: #7c3aed; --border: rgba(15, 23, 42, .16); --solid-bg: #0f172a; --solid-fg: #fff; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: "Inter", system-ui, "Segoe UI", Arial, sans-serif; color: var(--text); text-align: center;
  background: var(--bg) radial-gradient(700px 500px at 15% 10%, rgba(34, 211, 238, .16), transparent 60%), radial-gradient(700px 500px at 85% 90%, rgba(139, 92, 246, .2), transparent 60%); }
.code { font-size: clamp(6rem, 24vw, 11rem); font-weight: 900; line-height: 1; letter-spacing: -.06em; background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 30px rgba(96, 165, 250, .35)); }
h1 { margin: 12px 0 0; font-size: 1.6rem; color: var(--head); letter-spacing: -.02em; }
p { margin: 12px auto 0; max-width: 420px; color: var(--muted); }
.mono { font-family: "JetBrains Mono", Consolas, monospace; font-size: .8rem; letter-spacing: .16em; color: var(--c1); }
a { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; padding: 12px 22px; border-radius: 14px; background: var(--solid-bg); color: var(--solid-fg); font-weight: 700; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--c1); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="mono">ERROR · PAGE NOT FOUND</div>
  <div class="code" aria-hidden="true">404</div>
  <h1>This page drifted out of orbit.</h1>
  <p>The link may be broken or the page may have moved. Let's get you back to the portfolio.</p>
  <a id="home" href="./">← Back to the portfolio</a>
</main>
<script>
/* Missing pages can be nested at any depth, so point "home" at the /portfolio/ root when we are under it. */
(function () {
  var m = location.pathname.match(/^(.*?\/portfolio\/)/i);
  if (m) document.getElementById('home').setAttribute('href', m[1]);
})();
</script>
</body>
</html>
